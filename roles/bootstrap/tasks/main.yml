---
- name: Install the pinned Ubuntu Docker package
  ansible.builtin.apt:
    name:
      - docker.io=29.1.3-0ubuntu3~24.04.2
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 86400
    install_recommends: false

- name: Enable the Docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Authorize the dedicated deployment key without PTY or forwarding
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "restrict {{ lookup('ansible.builtin.file', '.secrets/deploy-key.pub') }}"
    state: present
    owner: root
    group: root
    mode: "0600"
