[defaults]
inventory = inventories/production/hosts.yml
roles_path = roles
local_tmp = .ansible/tmp
remote_tmp = /opt/devops-portfolio/.ansible/tmp
host_key_checking = True
interpreter_python = /usr/bin/python3

[ssh_connection]
ssh_args = -4 -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
